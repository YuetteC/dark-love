<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我喜歡你</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        body {
            background-color: black;
            color: white;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 修正後的心臟樣式 */
        .heart {
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: darkred;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            animation: heartbeat 1.5s infinite, shake 0.3s infinite;
            filter: drop-shadow(0 0 15px red);
        }

        .heart::before, .heart::after {
            content: "";
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: darkred;
            border-radius: 50%;
        }

        .heart::before {
            top: -75px;
            left: 0;
        }

        .heart::after {
            left: 75px;
            top: 0;
        }

        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes shake {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -50%) rotate(1deg); }
            100% { transform: translate(-50%, -50%) rotate(-1deg); }
        }

        /* 動態文字 */
        .text {
            position: absolute;
            font-size: 2rem;
            animation: fadeInOut 3s infinite, moveRandom 5s infinite;
            opacity: 0.8;
            transform: rotate(0deg);
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes moveRandom {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(calc(100vw * (random() - 0.5)), calc(100vh * (random() - 0.5))) rotate(calc(20deg * (random() - 0.5))); }
        }
    </style>
</head>
<body>
    <!-- 修正後的心臟 -->
    <div class="heart"></div>

    <script>
        const phrases = [
            "我喜歡你", "你無處可逃", "在我的世界裡", "心跳聲響起",
            "你能聽見嗎？", "越來越快", "無法停止", "沉淪", "我在等你"
        ];

        function createText() {
            const text = document.createElement("div");
            text.classList.add("text");
            text.innerText = phrases[Math.floor(Math.random() * phrases.length)];

            const size = Math.random() * 2 + 1; // 1rem ~ 3rem
            text.style.fontSize = `${size}rem`;
            text.style.left = `${Math.random() * 100}vw`;
            text.style.top = `${Math.random() * 100}vh`;

            document.body.appendChild(text);

            setTimeout(() => {
                text.remove();
            }, 5000);
        }

        setInterval(createText, 500);

        // 背景音效
        const audio = new Audio("https://www.fesliyanstudios.com/play-mp3/387"); // 低頻心跳聲
        audio.loop = true;
        audio.volume = 0.5;
        document.body.addEventListener("click", () => {
            audio.play();
        });
    </script>
</body>
</html>
